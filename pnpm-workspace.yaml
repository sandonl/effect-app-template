packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  workerd: true

peerDependencyRules:
  allowedVersions:
    # Alchemy beta.65 pins 0.30.2 while its Vite plugins still declare ^0.29.0.
    "@distilled.cloud/cloudflare": 0.30.2

catalog:
  "@base-ui/react": 1.6.0
  "@effect/atom-react": 4.0.0-beta.100
  "@effect/platform-browser": 4.0.0-beta.100
  "@effect/platform-node": 4.0.0-beta.100
  "@effect/vitest": 4.0.0-beta.100
  "@types/node": 26.1.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.3
  alchemy: 2.0.0-beta.65
  effect: 4.0.0-beta.100
  oxlint: 1.76.0
  react: 19.2.7
  react-dom: 19.2.7
  scheduler: 0.27.0
  tsup: 8.5.1
  tsx: 4.23.1
  turbo: 2.10.5
  typescript: 6.0.3
  vite: 8.1.4
  vitest: 4.1.10

minimumReleaseAgeExclude:
  - "@distilled.cloud/aws@0.30.2"
  - "@distilled.cloud/axiom@0.30.2"
  - "@distilled.cloud/cloudflare@0.30.2"
  - "@distilled.cloud/cloudflare-rolldown-plugin@0.13.10"
  - "@distilled.cloud/cloudflare-runtime@0.13.10"
  - "@distilled.cloud/cloudflare-vite-plugin@0.13.10"
  - "@distilled.cloud/core@0.30.2"
  - "@distilled.cloud/neon@0.30.2"
  - "@distilled.cloud/planetscale@0.30.2"
  - alchemy@2.0.0-beta.65
  - oxlint@1.76.0

overrides:
  effect: "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-browser": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
